name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not post API keys, and report security problems privately to security@mesharc.dev, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or code to reproduce
      description: The smallest example that shows the problem.
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: From the error, if there was one. It lets us find the request in our logs.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The package or server version, and your runtime and client (for example Claude Code, Cursor).
    validations:
      required: true
